<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffd34e">
  <meta name="psm-app-version" content="3.3.69">
  <meta name="description" content="pop'n musicのスコアとメダルを管理する非公式ツール">
  <link rel="icon" type="image/x-icon" sizes="any" href="./assets/psm-favicon-315.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/psm-icon-192-315.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/psm-touch-315.png">
  <link rel="manifest" href="./manifest.webmanifest?v=3.1.5">
  <title>pop'n Score Manager</title>
  <link rel="stylesheet" href="./css/base.css?v=3.0.142">
  <link rel="stylesheet" href="./css/components.css?v=3.3.47">
  <link rel="stylesheet" href="./css/themes.css">
<link rel="stylesheet" href="./css/responsive.css?v=3.1.9">
<link rel="stylesheet" href="./css/app.css?v=3.3.56">
  <link rel="stylesheet" href="./css/loading-screen.css?v=3.1.6">
  <link rel="stylesheet" href="./css/average-scores.css?v=3.0.141">
  <link rel="stylesheet" href="./css/version-check.css?v=3.1.23">
</head>
<body class="auth-pending">
  <div id="psmStartupLoading" role="status" aria-live="polite" aria-label="読み込み中">
    <div class="psm-loading-preview" aria-hidden="true">
      <div class="psm-preview-heading"></div>
      <div class="psm-preview-tabs"><i></i><i></i><i></i></div>
      <div class="psm-preview-row"><i></i><span></span><b></b></div>
      <div class="psm-preview-row"><i></i><span></span><b></b></div>
      <div class="psm-preview-row"><i></i><span></span><b></b></div>
      <div class="psm-preview-row"><i></i><span></span><b></b></div>
    </div>
    <div class="psm-loading-card">
      <div class="psm-loading-title-row" aria-hidden="true"><span></span><span></span></div>
      <h2 class="psm-loading-title">読み込み中</h2>
      <p class="psm-loading-subtitle">曲データを読み込んでいます</p>
      <div class="psm-loading-hero" aria-hidden="true">
        <img class="psm-loading-mascot-art" src="./assets/loading-mascots-137.png" alt="" width="826" height="315" decoding="async">
      </div>
      <p class="psm-loading-status" id="psmLoadingStatus">起動準備中です</p>
      <div class="psm-loading-tip"><span class="psm-loading-tip-icon" aria-hidden="true"><img src="./assets/loading-lightbulb-137.png" alt="" width="138" height="144"></span><p id="psmLoadingTipText">お気に入りの曲を見つけて、あなただけのスコアリストを作りましょう！</p></div>
      <button type="button" class="psm-loading-retry" id="psmLoadingRetry">再読み込み</button>
    </div>
  </div>
  <script>
    (() => {
      const screen = document.getElementById('psmStartupLoading');
      const status = document.getElementById('psmLoadingStatus');
      const tip = document.getElementById('psmLoadingTipText');
      const tips = [
        'お気に入りの曲を見つけて、あなただけのスコアリストを作りましょう！',
        '同期後はPSR保存履歴から、過去の数値や順位変化をいつでも見返せます。',
        '曲カードをタップすると、ライバルとの比較をすばやく確認できます。'
      ];
      let finished = false;
      let tipIndex = 0;
      const tipTimer = window.setInterval(() => {
        if (finished) return;
        tipIndex = (tipIndex + 1) % tips.length;
        tip.textContent = tips[tipIndex];
      }, 4600);
      const timeout = window.setTimeout(() => {
        if (finished) return;
        screen.classList.add('is-stalled');
        status.textContent = '読み込みに時間がかかっています。通信状況をご確認ください。';
      }, 20000);
      document.getElementById('psmLoadingRetry').addEventListener('click', () => window.location.reload());
      // External module failures happen before app.js can show an error.
      window.addEventListener('unhandledrejection', event => {
        window.psmLoading?.error(event.reason);
      });
      window.psmLoading = {
        status(message) {
          if (finished) return;
          if (message) status.textContent = message;
        },
        finish() {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          clearInterval(tipTimer);
          status.textContent = '準備ができました';
          window.setTimeout(() => { screen.hidden = true; }, 180);
        },
        error(error) {
          if (finished) return;
          clearTimeout(timeout);
          clearInterval(tipTimer);
          screen.classList.add('is-stalled');
          status.textContent = '読み込みに失敗しました：' + (error?.message || String(error || '原因不明')) + '。再読み込みしてください。';
        }
      };
    })();
  </script>
  <div id="authMount"></div>
  <div id="appMount"></div>
  <div id="dialogsMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/bootstrap.js?v=3.3.69"></script>
</body>
</html>
